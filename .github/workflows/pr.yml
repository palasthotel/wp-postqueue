name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-pr.yml@v1
    with:
      slug: postqueue
      dev-plugin-name: Postqueue - DEV
      build-command: npm ci && npm run build
      # What the plugin enqueues, so a renamed build output fails here instead of
      # 404ing in wp-admin. vendor/autoload.php is what pack.sh regenerates from
      # composer.json.
      required-files: |
        vendor/autoload.php
        dist/editor.js
        dist/editor.css
        dist/editor.asset.php
        dist/meta-box.js
        dist/meta-box.css
        dist/meta-box.asset.php
        dist/block-editor.js
        dist/block-editor.asset.php
        js/tinymce.js
        css/tinymce.css
        css/tinymce-plugin.css
        languages/postqueue-de_DE.mo
